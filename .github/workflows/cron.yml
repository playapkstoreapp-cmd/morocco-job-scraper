name: Daily Automated Job Scraper

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Scraper Script
        run: node scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Job Bot Automation"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase --allow-unrelated-histories || true
          git add jobs.json
          git commit -m "Automated daily job sync update" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
