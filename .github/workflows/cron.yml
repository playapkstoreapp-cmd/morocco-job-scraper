name: Daily Automated Job Scraper

on:
  schedule:
    - cron: '0 6 * * *' # Runs automatically every day at 6:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Execute Scraper Script
        run: node scrape.js

      - name: Pull Latest Remote Changes
        run: git pull origin main --rebase

      - name: Commit and Push Updated Jobs to GitHub
        run: |
          git config --global user.name "Job Bot Automation"
          git config --global user.email "bot@users.noreply.github.com"
          git add jobs.json
          git commit -m "Automated daily job sync update" || echo "No changes to commit"
          git push origin main
